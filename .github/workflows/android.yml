name: Test and Android build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  GODOT_VERSION: "4.7.2"
  GODOT_MINOR: "4.7"

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache Godot
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}-android-v1

      - name: Download Godot and Android export templates
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          TPL=~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          mkdir -p ~/godot "$TPL"
          cd ~/godot
          BASE=https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable
          wget -q "$BASE/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          wget -q "$BASE/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -q "Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" godot
          unzip -q "Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          find templates -type f ! -name 'android*' ! -name 'version.txt' -delete
          mv templates/* "$TPL"/
          rm -rf templates *.zip *.tpz

      - name: Android SDK packages
        run: |
          set -euo pipefail
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.1.0" > /dev/null

      - name: Debug keystore
        run: >
          keytool -genkeypair -keystore ~/debug.keystore
          -storepass android -alias androiddebugkey -keypass android
          -keyalg RSA -keysize 2048 -validity 10000
          -dname "CN=Android Debug,O=Android,C=US"

      - name: Configure Godot editor settings
        run: |
          mkdir -p ~/.config/godot
          for f in editor_settings-4.tres "editor_settings-${GODOT_MINOR}.tres"; do
            printf '%s\n' \
              '[gd_resource type="EditorSettings" format=3]' \
              '' \
              '[resource]' \
              "export/android/android_sdk_path = \"$ANDROID_SDK_ROOT\"" \
              "export/android/java_sdk_path = \"$JAVA_HOME\"" \
              "export/android/debug_keystore = \"$HOME/debug.keystore\"" \
              'export/android/debug_keystore_user = "androiddebugkey"' \
              'export/android/debug_keystore_pass = "android"' \
              > ~/.config/godot/"$f"
          done

      - name: Import project
        run: timeout 300 ~/godot/godot --headless --path . --import

      # Every step fails on its own errors: no "|| true", no continue-on-error.
      - name: Tests (shell, economy, save, battle mechanics)
        run: |
          set -o pipefail
          timeout 300 ~/godot/godot --headless --path . --script res://tests/test_run.gd 2>&1 | tee test.log
          if grep -E "SCRIPT ERROR|Parse Error|Failed to load|FAIL " test.log; then exit 1; fi
          grep -q "TEST DONE, fails: 0" test.log

      - name: Android debug APK
        run: |
          set -o pipefail
          mkdir -p build
          timeout 600 ~/godot/godot --headless --path . --export-debug "Android" build/oksi-tanks.apk 2>&1 | tee export.log
          if grep -E "SCRIPT ERROR|Parse Error" export.log; then exit 1; fi
          test -s build/oksi-tanks.apk
          ls -la build/

      - uses: actions/upload-artifact@v4
        with:
          name: oksi-tanks-debug-apk
          path: build/oksi-tanks.apk
